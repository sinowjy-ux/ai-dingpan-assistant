<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script>document.documentElement.dataset.theme=localStorage.getItem("aidp_theme")||"dark"</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日复盘 · AI 盯盘助手</title>
<link rel="stylesheet" href="/common.css">
<style>
.cols{display:grid;gap:10px}
.c3{grid-template-columns:repeat(3,1fr)} .c4{grid-template-columns:repeat(4,1fr)} .c8{grid-template-columns:repeat(8,1fr)}
.box{background:var(--soft);border-radius:8px;padding:10px 12px}
.box h4{margin:0 0 6px;font-size:12px;color:var(--ink2);font-weight:600}
.q{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.imp{display:grid;grid-template-columns:170px 110px 70px 1fr;gap:10px;padding:6px 8px;border-radius:6px;font-size:13px}
.imp.strong{background:var(--soft)} .imp.weak{opacity:.55}
.v{font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:99px;padding:0 6px}
.bars{display:flex;align-items:flex-end;gap:8px;height:100px}
.bars div{flex:1;text-align:center;font-size:10px;color:var(--ink2)}
.bars i{display:block;border-radius:3px 3px 0 0;margin:2px auto}
.fl{display:grid;grid-template-columns:90px 52px 1fr 64px;gap:6px;align-items:center;font-size:12px}
.fl i{display:block;height:8px;border-radius:2px}
.sec{background:var(--soft);border-radius:8px;padding:10px;margin-bottom:8px;font-size:12.5px}
.sec .t{display:flex;gap:8px;align-items:baseline}
.sec ul{margin:4px 0;padding-left:16px}
.sec a{color:var(--accent);text-decoration:none}
.sum{white-space:pre-line;font-size:14px;line-height:1.9}
.tips{background:color-mix(in srgb,var(--gold) 10%,transparent);border-radius:8px;padding:10px 14px;margin-top:10px}
@media (max-width:1000px){.c3,.c4,.c8{grid-template-columns:1fr 1fr}.imp{grid-template-columns:1fr 1fr}}
</style>
<link rel="stylesheet" href="/theme.css">
</head>
<body>
<div class="wrap">
  <nav class="top"></nav>
  <div class="card" style="margin-top:0;display:flex;gap:14px;align-items:center;flex-wrap:wrap">
    <div class="icon-sq" style="color:var(--bad)">复</div>
    <div><h1>每日复盘 <span class="pill" id="badge" style="color:var(--bad) !important;border-color:var(--bad) !important"></span></h1><div class="sub" id="gen">外围市场 · 成交量 · 资金流向 · 板块原因 · 选股比对</div></div>
    <span style="flex:1"></span>
    <span class="sub" id="runlog"></span>
    <select id="date"></select>
    <button class="btn" id="build">生成 / 更新今日复盘</button>
  </div>
  <div id="body"><div class="empty">加载中…</div></div>
</div>
<script src="/common.js"></script>
<script>
const $ = s => document.querySelector(s);
const num = (x, d = 2) => x == null ? "—" : (x >= 1000 ? x.toFixed(0) : x.toFixed(d));
const WD = d => ["周日", "周一", "周二", "周三", "周四", "周五", "周六"][new Date(d + "T00:00:00").getDay()];

function quotes(title, items) {
  return `<div class="box"><h4>${title}</h4>${items.map(x => `<div class="q"><span>${esc(x.name)}</span><span><span class="num dim">${num(x.price)}</span>
    <b class="num ${cls(x.chg)}" style="display:inline-block;width:72px;text-align:right">${sgn(x.chg)}</b></span></div>`).join("")}</div>`;
}
function flowList(title, items) {
  const mx = Math.max(...items.map(x => Math.abs(x.flow)), 1);
  return `<div class="box"><h4>${title}</h4>${items.slice(0, 10).map(x => `<div class="fl"><span>${esc(x.name)}</span>
    <span class="num ${cls(x.zdf)}">${sgn(x.zdf)}</span><i style="width:${Math.max(2, Math.abs(x.flow) / mx * 100)}%;background:${x.flow >= 0 ? "var(--up)" : "var(--down)"}"></i>
    <b class="num ${cls(x.flow)}" style="text-align:right">${(x.flow > 0 ? "+" : "") + x.flow.toFixed(1)}亿</b></div>`).join("")}</div>`;
}
function sector(b) {
  return `<div class="sec"><div class="t"><b style="font-size:14px">${esc(b.name)}</b><b class="num ${cls(b.zdf)}">${sgn(b.zdf)}</b>
    <span style="flex:1"></span><span class="num ${cls(b.flow)}">${(b.flow > 0 ? "+" : "") + b.flow.toFixed(1)} 亿</span></div>
    <ul>${b.reasons.map(x => `<li class="${x.startsWith("外围") ? "gold" : ""}">${esc(x)}</li>`).join("")}</ul>
    ${b.news.map(n => `<div><span class="num dim">${n.time}</span> ${n.url ? `<a href="${esc(n.url)}" target="_blank">${esc(n.title)}</a>` : esc(n.title)}</div>`).join("")}</div>`;
}

function render(rv) {
  const r = rv.data, e = r.external, t = r.turnover || {}, b = r.breadth || {}, f = r.flow || {}, s = r.sectors || {};
  $("#badge").textContent = `${r.date} ${WD(r.date)} · ${r.kind}`;
  $("#gen").textContent = `生成于 ${r.generated}（北京时间）· 用时 ${r.seconds} 秒` + (r.errors.length ? ` · ${r.errors.length} 项数据取不到` : "");
  const hist = t.history || [], hmx = Math.max(...hist.map(x => x.total), 1);
  const dist = b.dist || [], dmx = Math.max(...dist.map(x => x.n), 1);
  const y = r.yesterday || {}, ym = (y.methods || []).filter(m => m.n1 > 0);
  $("#body").innerHTML = `
  <div class="card"><h2><span class="n">1</span>外围市场 <span class="sub">A 股开盘前：隔夜美股（${e.us_date} 收盘）、亚太、商品与汇率</span></h2>
    <div class="cols c3">${quotes("隔夜美股", e.us)}${quotes("港股 · 亚太 · A50", e.asia)}${quotes("商品 · 汇率", e.commodity.concat(e.fx))}</div></div>
  <div class="card"><h2><span class="n">2</span>外围对 A 股的影响 <span class="sub">预期方向 vs 当天相关板块实际涨跌</span></h2>
    ${r.impacts.map(i => `<div class="imp ${i.strong ? "strong" : "weak"}"><b class="num ${cls(i.chg)}">${esc(i.factor)}</b><b>${esc(i.group)}</b>
      <b class="${i.expect === "利好" ? "pos" : i.expect === "利空" ? "neg" : "dim"}">${i.expect}</b>
      <div>${i.actual != null ? `相关板块平均 <span class="num ${cls(i.actual)}">${sgn(i.actual)}</span> ${i.verdict ? `<span class="v ${i.verdict === "兑现" ? "gold" : ""}">${i.verdict}</span>` : ""}` : ""}
      <div class="dim" style="font-size:11.5px">${i.sectors.map(x => esc(x.name) + " " + sgn(x.zdf)).join("　")}</div></div></div>`).join("")}</div>
  <div class="card"><h2><span class="n">3</span>A 股大盘 <span class="sub">指数 · 成交额 · 涨跌家数 · 涨停跌停 · 连板（沪深 A 股，不含北交所 / ST）</span></h2>
    <div class="cols c8">${r.indices.map(x => `<div class="box"><h4>${esc(x.name)}</h4><div class="num" style="font-weight:600">${num(x.price)}</div><b class="num ${cls(x.chg)}">${sgn(x.chg)}</b></div>`).join("")}</div>
    <div class="cols c3" style="margin-top:10px">
      <div class="box"><h4>两市成交额</h4><div class="num" style="font-size:24px;font-weight:700">${yi(t.total)}</div>
        ${t.change != null ? `<b class="${t.change > 0 ? "pos" : "neg"}">${t.change > 0 ? "放量" : "缩量"} ${yi(Math.abs(t.change))}（${sgn(t.change_pct, 1)}）</b>` : ""}
        <div class="dim" style="font-size:12px">沪 ${yi(t.sh)} · 深 ${yi(t.sz)} · 5 日均 ${yi(t.avg5)}</div>
        <div class="bars" style="margin-top:6px">${hist.map((x, i) => `<div>${(x.total / 10000).toFixed(1)}<i style="height:${x.total / hmx * 64}px;background:var(--accent);opacity:${i === hist.length - 1 ? 1 : .4}"></i>${x.date.slice(5)}</div>`).join("")}</div></div>
      <div class="box"><h4>涨跌分布 <span style="float:right"><b class="pos">涨 ${b.up}</b> · 平 ${b.flat} · <b class="neg">跌 ${b.down}</b></span></h4>
        <div class="bars">${dist.map((x, i) => `<div>${x.n}<i style="height:${Math.max(2, x.n / dmx * 64)}px;background:${i < 4 ? "var(--up)" : i === 4 ? "var(--ink2)" : "var(--down)"}"></i>${x.label}</div>`).join("")}</div>
        <div class="dim" style="font-size:12px">中位数 ${sgn(b.median)} · 平均 ${sgn(b.mean)}</div></div>
      <div class="box"><h4>涨停 <b class="pos">${b.limit_up}</b> · 跌停 <b class="neg">${b.limit_down}</b> · 炸板 ${b.zhaban}（炸板率 ${b.zhaban_rate == null ? "—" : b.zhaban_rate.toFixed(0) + "%"}）</h4>
        <div class="dim" style="font-size:12px">连板梯队（最高 ${b.max_streak} 板）</div>
        ${(b.ladder || []).slice(0, 5).map(l => `<div style="font-size:12.5px"><b class="${l.n >= 3 ? "gold" : ""}">${l.n} 板</b> <span class="dim">${l.count} 只</span> ${l.stocks.slice(0, 8).map(x => esc(x.name)).join("、")}</div>`).join("")}</div>
    </div></div>
  <div class="card"><h2><span class="n">4</span>资金流向 <span class="sub">主力净流入 = 超大单 + 大单（腾讯口径）；行业为申万一级</span></h2>
    <div class="kpis">${[["全市场主力净流入", f.main], ["近 5 日累计", f.main5], ["近 20 日累计", f.main20]].map(([k, v]) =>
      `<div class="kpi"><div class="k">${k}</div><div class="v ${cls(v)}">${v > 0 ? "+" : ""}${(v || 0).toFixed(0)} 亿</div></div>`).join("")}
      <div class="kpi"><div class="k">净流入行业</div><div class="v">${(f.industries || []).filter(x => x.flow > 0).length} / ${(f.industries || []).length}</div></div></div>
    <div class="cols c4" style="margin-top:10px">${flowList("行业 · 净流入前 10", f.in || [])}${flowList("行业 · 净流出前 10", f.out || [])}
      ${flowList("概念 · 净流入前 10", f.concept_in || [])}${flowList("概念 · 净流出前 10", f.concept_out || [])}</div></div>
  <div class="card"><h2><span class="n">5</span>板块涨跌与主要原因 <span class="sub">原因 = 资金 + 涨跌家数 + 龙头/成分股 + 外围联动 + 当天相关快讯</span></h2>
    <div class="cols c4">${[["行业领涨（申万二级）", s.top], ["行业领跌（申万二级）", s.bottom], ["概念领涨", s.concept_top], ["概念领跌", s.concept_bottom]]
      .map(([tt, bs]) => `<div><h4 class="dim" style="margin:0 0 6px;font-size:12px">${tt}</h4>${(bs || []).slice(0, 5).map(sector).join("")}</div>`).join("")}</div></div>
  <div class="card"><h2><span class="n">6</span>选股比对 <span class="sub">上一交易日（${y.date || "—"}）选出的股票今天的表现</span></h2>
    <div class="kpis"><div class="kpi"><div class="k">今日主力选股</div><div class="v">${r.picks.screener}</div></div>
      <div class="kpi"><div class="k">今日盯盘信号</div><div class="v">${r.picks.monitor}</div></div>
      <div class="kpi"><div class="k">已验证 / 命中</div><div class="v gold">${r.picks.validated}</div></div></div>
    ${ym.length ? `<table class="num" style="margin-top:8px"><thead><tr><th class="l">方法</th><th>条数</th><th>T+1 平均</th><th>胜率</th><th>超额</th><th>跑赢大盘</th></tr></thead><tbody>
      ${ym.map(m => `<tr><td class="l"><span class="dim">${m.source === "screener" ? "选股" : (m.market === "us" ? "盯盘·美" : "盯盘")}</span> <b>${esc(m.method)}</b> <span class="dim">${m.tier}</span></td>
        <td>${m.n1}</td><td class="${cls(m.r1)}">${sgn(m.r1)}</td><td>${m.win1.toFixed(0)}%</td><td class="${cls(m.ex1)}">${sgn(m.ex1)}</td><td>${m.beat1 == null ? "—" : m.beat1.toFixed(0) + "%"}</td></tr>`).join("")}</tbody></table>`
      : `<div class="dim" style="margin-top:8px">上一交易日没有存入数据库的选股，或还没有比对结果</div>`}</div>
  <div class="card"><h2><span class="n">7</span>汇总与明日要点 <span class="sub">由以上数据按规则生成</span></h2>
    <div class="sum">${esc(r.summary)}</div>
    ${r.outlook.length ? `<div class="tips"><b class="gold">明日要点</b>${r.outlook.map(x => `<div>· ${esc(x)}</div>`).join("")}</div>` : ""}
    ${r.errors.length ? `<div class="pos" style="font-size:12px;margin-top:8px">取不到的数据：${esc(r.errors.join("；"))}</div>` : ""}</div>`;
}

async function load(date) {
  try {
    const rv = await api("/api/review" + (date ? "?date=" + date : ""));
    render(rv);
    const S = await api("/api/db/summary");
    const ds = S.dates.filter(d => d.review).map(d => d.date);
    if (!ds.includes(rv.date)) ds.unshift(rv.date);
    $("#date").innerHTML = ds.map(d => `<option ${d === rv.date ? "selected" : ""}>${d}</option>`).join("");
  } catch (e) {
    $("#body").innerHTML = `<div class="card empty">还没有复盘。点右上角“生成 / 更新今日复盘”（约 1 分钟）。</div>`;
  }
}
async function waitBuild() {
  $("#build").disabled = true; $("#build").textContent = "生成中…";
  while (true) {
    const st = await api("/api/review/status");
    $("#runlog").textContent = st.log.slice(-1)[0] || "正在抓取数据…";
    if (!st.running) break;
    await new Promise(r => setTimeout(r, 1500));
  }
  $("#build").disabled = false; $("#build").textContent = "生成 / 更新今日复盘"; $("#runlog").textContent = "";
  load();
}
$("#build").onclick = async () => { await post("/api/review/build"); waitBuild(); };
$("#date").onchange = () => load($("#date").value);
load(new URLSearchParams(location.search).get("date"));
api("/api/review/status").then(st => st.running && waitBuild());
</script>
</body>
</html>
